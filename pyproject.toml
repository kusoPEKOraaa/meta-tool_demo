[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metatool-demo"
version = "0.1.0"
description = "Meta-Tool demo for automated Python code review and refactoring."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "kusoPEKOraaa" }]

[project.scripts]
review_code = "metatool.cli:main"

[tool.setuptools]
packages = ["metatool", "metatool.providers"]
